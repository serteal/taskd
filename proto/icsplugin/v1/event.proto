syntax = "proto3";

package icsplugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "todoapp/gen/icsplugin/v1;icspluginv1";

// Event is the ics connector's typed extension payload, stored in
// mirror.data["event"] and registered with the core via the manifest's
// descriptor set — which is what lets CEL bindings like
// `item.mirror.data["event"].start` typecheck and evaluate.
//
// This is a PLUGIN's type, not part of taskcore: it lives in the same buf
// module for repo convenience, but nothing in the core may import it.
message Event {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  bool all_day = 3;
  string location = 4;
  string organizer = 5;
  // Raw RRULE of the series (series item only).
  string rrule = 6;
}
