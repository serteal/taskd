syntax = "proto3";

package todotxtplugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "todoapp/gen/todotxtplugin/v1;todotxtpluginv1";

// Task is the todotxt connector's typed extension payload, stored in
// mirror.data["task"]. A plugin's type in the shared buf module for repo
// convenience; nothing in the core may import it.
message Task {
  // "A".."Z" or empty.
  string priority = 1;
  repeated string projects = 2; // +project tags
  repeated string contexts = 3; // @context tags
  google.protobuf.Timestamp due = 4;          // due: tag
  google.protobuf.Timestamp created_on = 5;   // leading creation date
  google.protobuf.Timestamp completed_on = 6; // completion date after x
}
