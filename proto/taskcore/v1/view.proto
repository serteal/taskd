syntax = "proto3";

package taskcore.v1;

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// View is a named query: filter + presentation hints. The same schema serves
// user-defined saved views and (later) plugin-contributed views. Well-known
// names by convention: "inbox", "today", "pending", "completed".
message View {
  string name = 1;
  string description = 2;
  // CEL filter over items, e.g. '!completed && project == "work/reviews"'.
  string filter = 3;
  // Sort key: one of the indexed virtual fields ("due", "created_at",
  // "updated_at", "project", "kind"), optionally suffixed " desc".
  string order_by = 4;
  // CEL expression items are grouped by (optional).
  string group_by = 5;
  // Column ids for list rendering (optional; frontends have defaults).
  repeated string columns = 6;
  // Lanes let one definition render as a flat list in the CLI and a board in
  // the TUI/web (optional).
  LaneSpec lanes = 7;
}

message LaneSpec {
  // CEL expression mapping an item to a lane value.
  string expr = 1;
  // Explicit lane ordering; unlisted values append after, in encounter order.
  repeated string order = 2;
}
