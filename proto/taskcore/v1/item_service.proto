syntax = "proto3";

package taskcore.v1;

import "google/protobuf/field_mask.proto";
import "taskcore/v1/event.proto";
import "taskcore/v1/item.proto";

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// ItemService is the single read/write surface for items. Writes route by
// layer: todo fields commit locally; mirror-backed fields become intents
// (phase 4) or are rejected as read-only. One Update call may touch only one
// layer — mixed calls are rejected so partial-success semantics never exist.
service ItemService {
  // Creates a native task (kind "task", todo layer only). Mirrored items are
  // created by connectors, never through this RPC.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  // Native items only; never touches any remote. Tracked items are
  // completed, never deleted.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc QueryItems(QueryItemsRequest) returns (QueryItemsResponse);
  // Streams the change feed from a cursor. since_cursor 0 means "from now".
  // A cursor older than the log's retention fails with FAILED_PRECONDITION
  // (reason "CURSOR_EXPIRED"); the client SDK then resyncs via QueryItems
  // and resumes from the snapshot's cursor.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message CreateItemRequest {
  // Only todo fields are honored; id, kind, revisions, and timestamps are
  // assigned by the core.
  Todo todo = 1;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  string id = 1;
  // Field paths relative to Item, e.g. "todo.note", "todo.labels". All paths
  // must belong to a single layer. Mirror paths require the connector to
  // handle the corresponding intent and are rejected until intents ship.
  google.protobuf.FieldMask update_mask = 2;
  // Carries the new values for masked paths.
  Item item = 3;
  // Optimistic concurrency: when nonzero, the write fails with ABORTED if
  // the current todo_revision differs.
  uint64 expected_todo_revision = 4;
  // Reserved for mirror-layer writes via intents (phase 4).
  uint64 expected_mirror_revision = 5;
}

message UpdateItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  string id = 1;
}

message DeleteItemResponse {}

message QueryItemsRequest {
  // CEL filter over items. Empty matches everything; callers wanting the
  // default "active only" behavior say '!completed' (frontends do this for
  // the user).
  string filter = 1;
  // See View.order_by. Defaults to "created_at desc".
  string order_by = 2;
  // Defaults to 100, capped at 1000.
  int32 page_size = 3;
  string page_token = 4;
}

message QueryItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
  // The change-feed cursor this snapshot is consistent with. Resume Watch
  // from here for a gapless snapshot-then-follow.
  uint64 cursor = 3;
}

message WatchRequest {
  // 0 means "from now" (a checkpoint with the current cursor is sent first).
  uint64 since_cursor = 1;
  // Optional CEL filter; only events whose after-image matches are sent.
  string filter = 2;
}

message WatchResponse {
  oneof msg {
    Event event = 1;
    // Periodic position marker; also sent first on a from-now watch.
    Checkpoint checkpoint = 2;
  }
}

message Checkpoint {
  uint64 cursor = 1;
}
