syntax = "proto3";

package taskcore.v1;

import "google/protobuf/struct.proto";
import "taskcore/v1/intent.proto";

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// IntentService is the outbox surface: invoke writes toward remotes and
// manage what is queued or failed. User edits, rule write-backs, and agent
// writes all flow through the same router behind this service — one place
// for capability checks, provenance, and audit.
service IntentService {
  // Routes one intent to the item's connector. Waits briefly (~2s) for a
  // terminal state when the connector is responsive; otherwise returns the
  // QUEUED record and the outbox delivers when it can.
  rpc InvokeIntent(InvokeIntentRequest) returns (InvokeIntentResponse);
  rpc GetIntent(GetIntentRequest) returns (GetIntentResponse);
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse);
  // Re-queues a FAILED intent.
  rpc RetryIntent(RetryIntentRequest) returns (RetryIntentResponse);
  // Terminal user decision for a FAILED or QUEUED intent.
  rpc DiscardIntent(DiscardIntentRequest) returns (DiscardIntentResponse);
}

message InvokeIntentRequest {
  // Item id (unique prefixes resolve, as everywhere).
  string item_id = 1;
  // Lowercase standard-intent name (see IntentRecord.intent).
  string intent = 2;
  // Intent parameters, e.g. {"title": ...} for rename. When omitted for
  // facet intents (set_completed, set_due), the router derives them from
  // the item's current local state — which is exactly what rule-driven
  // write-back wants: push what the item now says.
  google.protobuf.Struct params = 3;
}

message InvokeIntentResponse {
  IntentRecord record = 1;
}

message GetIntentRequest {
  string id = 1;
}

message GetIntentResponse {
  IntentRecord record = 1;
}

message ListIntentsRequest {
  // Empty means every non-terminal state (QUEUED, INFLIGHT, FAILED).
  repeated IntentState states = 1;
  // Restrict to one item (optional).
  string item_id = 2;
  // Defaults to 200, capped at 1000; newest first.
  int32 limit = 3;
}

message ListIntentsResponse {
  repeated IntentRecord records = 1;
}

message RetryIntentRequest {
  string id = 1;
}

message RetryIntentResponse {
  IntentRecord record = 1;
}

message DiscardIntentRequest {
  string id = 1;
}

message DiscardIntentResponse {
  IntentRecord record = 1;
}
