syntax = "proto3";

package taskcore.v1;

import "taskcore/v1/item.proto";
import "taskcore/v1/rule.proto";

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// RuleService: the store is the source of truth for rules (edited from any
// frontend); files are an import/export format. Rules are NOT retroactive —
// a new or edited rule applies to future changes; DryRunRule previews and
// BackfillRule applies once, explicitly.
service RuleService {
  // Upserts by rule.name after validating conditions and actions.
  rpc SaveRule(SaveRuleRequest) returns (SaveRuleResponse);
  rpc GetRule(GetRuleRequest) returns (GetRuleResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  // Evaluates the rule's condition as a level over current items: "what
  // would match right now". Works on unsaved rules.
  rpc DryRunRule(DryRunRuleRequest) returns (DryRunRuleResponse);
  // Applies a saved rule once to every currently matching item, as if the
  // condition had just become true for each. The explicit opt-in that keeps
  // rule edits non-retroactive by default.
  rpc BackfillRule(BackfillRuleRequest) returns (BackfillRuleResponse);
  // Rule templates shipped by installed (or previously installed) plugins:
  // proposals to copy into your rules, never enforced.
  rpc ListRuleTemplates(ListRuleTemplatesRequest) returns (ListRuleTemplatesResponse);
}

message SaveRuleRequest {
  Rule rule = 1;
}

message SaveRuleResponse {
  Rule rule = 1;
}

message GetRuleRequest {
  string name = 1;
}

message GetRuleResponse {
  Rule rule = 1;
}

message ListRulesRequest {}

message ListRulesResponse {
  // In evaluation order.
  repeated Rule rules = 1;
}

message DeleteRuleRequest {
  string name = 1;
}

message DeleteRuleResponse {}

message DryRunRuleRequest {
  Rule rule = 1;
}

message DryRunRuleResponse {
  // Capped at 100; total_matches reports the full count.
  repeated Item matches = 1;
  int32 total_matches = 2;
}

message BackfillRuleRequest {
  string name = 1;
}

message BackfillRuleResponse {
  int32 applied = 1;
}

message ListRuleTemplatesRequest {}

message ListRuleTemplatesResponse {
  repeated RuleTemplate templates = 1;
}

message RuleTemplate {
  // Plugin that shipped it.
  string plugin = 1;
  Rule rule = 2;
}
