syntax = "proto3";

package taskcore.v1;

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// AdminService: daemon handshake and operational commands.
service AdminService {
  // Version handshake; clients warn on skew.
  rpc Ping(PingRequest) returns (PingResponse);
  // Online backup via SQLite's safe copy (never a raw file copy, which can
  // corrupt against a live WAL database).
  rpc Backup(BackupRequest) returns (BackupResponse);
}

message PingRequest {
  string client_name = 1;
  string client_version = 2;
}

message PingResponse {
  string daemon_version = 1;
  // Oldest and newest change-feed cursors currently retained.
  uint64 oldest_cursor = 2;
  uint64 latest_cursor = 3;
}

message BackupRequest {
  // Absolute destination path for the backup database file.
  string destination_path = 1;
}

message BackupResponse {
  int64 bytes_written = 1;
}
