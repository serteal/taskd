syntax = "proto3";

package taskcore.v1;

import "google/protobuf/struct.proto";
import "taskcore/v1/item.proto";

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// Event is one entry in the append-only change feed — the universal
// integration point. Frontends staying live, rules firing, hooks, and agents
// all consume this same stream.
message Event {
  // Monotonically increasing position in the feed. Resume with
  // ItemService.Watch(since_cursor).
  uint64 cursor = 1;
  string item_id = 2;
  ChangeType type = 3;
  // What caused this change. Rules never fire on changes they caused;
  // provenance doubles as the audit trail.
  Provenance caused_by = 4;
  // Which fields changed, with old and new values. Old values riding in the
  // event are what make "became X" rules and edge detection implementable:
  // a full before-image is reconstructable by reverting these changes on the
  // after-image. Empty for CREATED (the after-image says it all).
  repeated FieldChange changes = 5;
  // Full after-image. For DELETED (native items only), the last state.
  Item item = 6;
}

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_CREATED = 1;
  CHANGE_TYPE_UPDATED = 2;
  // Native items only; tracked items are completed, never deleted.
  CHANGE_TYPE_DELETED = 3;
}

message Provenance {
  ProvenanceSource source = 1;
  // Source-specific reference: connector instance for SYNC, client name for
  // CLIENT, rule name for RULE, intent id for INTENT.
  string ref = 2;
}

enum ProvenanceSource {
  PROVENANCE_SOURCE_UNSPECIFIED = 0;
  PROVENANCE_SOURCE_SYNC = 1;
  PROVENANCE_SOURCE_CLIENT = 2;
  PROVENANCE_SOURCE_RULE = 3;
  PROVENANCE_SOURCE_INTENT = 4;
}

// FieldChange records one changed field path with its old and new values,
// encoded as protojson-compatible values. Paths use proto field names
// relative to Item, e.g. "todo.completed", "mirror.state",
// "todo.labels" (list fields change as a whole), "relations".
message FieldChange {
  string path = 1;
  google.protobuf.Value old_value = 2;
  google.protobuf.Value new_value = 3;
}
