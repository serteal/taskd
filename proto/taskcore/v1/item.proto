syntax = "proto3";

package taskcore.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "todoapp/gen/taskcore/v1;taskcorev1";

// Item is the unit of tracking: a native task, an un-triaged mirror of an
// external object, or (the common case) both glued together.
//
// The two layers have strictly separate owners:
//   - Mirror: facts about an external object. Connector-owned, downstream-only.
//     Sync is the only writer; users and rules never write mirror fields.
//   - Todo: the user's intent. User-owned; sync never writes todo fields.
// Because ownership is partitioned there is no field-level merge conflict
// machinery anywhere in the system.
message Item {
  // ULID assigned by the core. Immutable.
  string id = 1;
  // "task" for native items, otherwise a plugin-registered kind such as
  // "linear.issue" or "github.pr". Immutable.
  string kind = 2;
  // Absent on native tasks.
  Mirror mirror = 3;
  // Absent on un-triaged mirrors.
  Todo todo = 4;
  repeated Relation relations = 5;
  // Optimistic-concurrency counters, one per layer. Sync bumps
  // mirror_revision; user writes bump todo_revision. The layers can never
  // falsely conflict with each other.
  uint64 mirror_revision = 6;
  uint64 todo_revision = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Mirror holds remote-confirmed truth about exactly one external object.
message Mirror {
  // The single authoritative remote for this item. Cross-references between
  // remote objects are relations between two items, never two links here.
  ExternalLink link = 1;
  string title = 2;
  // Raw, kind-specific state: "merged", "triggered", "running". Meaningless
  // to the core; rules and display expressions give it meaning.
  string state = 3;
  // Typed extension payloads; message types are registered by kind providers
  // and persisted by the core.
  map<string, google.protobuf.Any> data = 4;
  // The remote object is gone or unreachable; this mirror is the frozen
  // last-known snapshot. The item itself is never deleted.
  bool stale = 5;
  // Set when a snapshot source stopped listing this object (tombstone grace
  // period); cleared if it reappears.
  google.protobuf.Timestamp missing_since = 6;
  // Attached explicitly (attach-to-remote) rather than arriving via the
  // instance's scope: the sync engine refreshes pinned mirrors individually
  // through Resolve and never applies snapshot-disappearance logic to them.
  bool pinned = 7;
}

// Todo is the user's commitment. Core state is deliberately binary; all
// richer ontology (urgency, waiting, wontdo, ...) lives in labels, projects,
// and rules.
message Todo {
  bool completed = 1;
  google.protobuf.Timestamp completed_at = 2;
  // Optional free-form qualifier: "wontdo", "gone", ...
  string completed_reason = 3;
  repeated string labels = 4;
  // Path-style, e.g. "work/reviews". Empty means no project.
  string project = 5;
  // User override; the effective due date falls back to the kind's mirror
  // binding when unset.
  google.protobuf.Timestamp due = 6;
  google.protobuf.Timestamp snoozed_until = 7;
  // Display title defaults to mirror.title (or this, for native tasks).
  string title_override = 8;
  string note = 9;
}

message ExternalLink {
  // Connector instance, e.g. "github@work" — instance, not just plugin.
  string connector_instance = 1;
  string external_id = 2;
  string external_url = 3;
  string etag = 4;
  google.protobuf.Timestamp last_synced_at = 5;
}

message Relation {
  RelationType type = 1;
  // Item id of the related item.
  string target_id = 2;
}

enum RelationType {
  RELATION_TYPE_UNSPECIFIED = 0;
  RELATION_TYPE_PARENT_OF = 1;
  RELATION_TYPE_INSTANCE_OF = 2;
  RELATION_TYPE_BLOCKS = 3;
  RELATION_TYPE_RELATES_TO = 4;
}
