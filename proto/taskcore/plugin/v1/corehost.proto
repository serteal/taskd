syntax = "proto3";

package taskcore.plugin.v1;

option go_package = "todoapp/gen/taskcore/plugin/v1;pluginv1";

// SecretService is served by the CORE to plugins, over the per-instance
// corehost socket (TASKPLUGIN_COREHOST_SOCKET). It is the optional,
// auth-agnostic helper from the design: plugins own their auth flows; the
// core stores opaque blobs in the OS keychain so the easy path is the safe
// one and no plugin invents plaintext token files. Keys are implicitly
// namespaced to the calling instance — one instance can never read
// another's secrets.
//
// This is the least-privilege plugin surface: plugins get exactly the
// services here, never the client API.
service SecretService {
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message PutSecretRequest {
  string key = 1;
  bytes value = 2;
}

message PutSecretResponse {}

message GetSecretRequest {
  string key = 1;
}

message GetSecretResponse {
  // Unset when the key does not exist (found = false), so callers can
  // distinguish empty from absent.
  bool found = 1;
  bytes value = 2;
}

message DeleteSecretRequest {
  string key = 1;
}

message DeleteSecretResponse {}
