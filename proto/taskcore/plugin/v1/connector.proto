syntax = "proto3";

package taskcore.plugin.v1;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "taskcore/v1/item.proto";
import "taskcore/plugin/v1/plugin.proto";

option go_package = "todoapp/gen/taskcore/plugin/v1;pluginv1";

// Connector is the source/sink surface a plugin implements per instance.
// Connectors are dumb by design: they translate between the remote's domain
// model and RemoteItems, own external identity (stable external_ids, RRULE
// expansion, content-hash matching — all translation), and handle intents.
// Reconciliation, diffing, tombstone grace, event generation, and scheduling
// belong to the core and never leak in here.
service ConnectorService {
  // Snapshot streams the full current in-scope set (SNAPSHOT enumeration).
  // The core diffs consecutive snapshots; the connector just enumerates.
  rpc Snapshot(SnapshotRequest) returns (stream SnapshotResponse);
  // Resolve fetches one remote object by user-supplied reference (URL or
  // native handle) for attach-to-remote, even outside the instance's scope.
  // Unimplemented is a valid answer.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // HandleIntent performs one standard intent against the remote and returns
  // the remote-confirmed result. Read-only connectors leave this
  // unimplemented; the core routes nothing not declared in capabilities.
  rpc HandleIntent(HandleIntentRequest) returns (HandleIntentResponse);
  // WatchRemote streams changes for INCREMENTAL sources, resumable by
  // cursor. Snapshot-mode connectors leave it unimplemented.
  rpc WatchRemote(WatchRemoteRequest) returns (stream WatchRemoteResponse);
}

// RemoteItem is a connector's view of one remote object — deliberately NOT a
// taskcore.v1.Item: a connector has no business producing item ids, todos,
// or revisions, so the shape makes that unrepresentable. The core builds the
// Mirror from this.
message RemoteItem {
  // Stable identity within the instance. The connector owns stability
  // (survives renames/moves as far as the source allows).
  string external_id = 1;
  string kind = 2;
  string title = 3;
  // Raw kind-specific state ("confirmed", "cancelled", "merged", ...).
  string state = 4;
  string url = 5;
  string etag = 6;
  // Typed extension payloads; types must be registered in the manifest.
  map<string, google.protobuf.Any> data = 7;
  // Optional hint: this object belongs to a parent (a recurring series, an
  // epic). The core resolves both external ids to items and wires the
  // relation; connectors never see item ids.
  string parent_external_id = 8;
  // Relation type for the parent hint; INSTANCE_OF when unspecified.
  taskcore.v1.RelationType parent_relation = 9;
}

message SnapshotRequest {}

message SnapshotResponse {
  RemoteItem item = 1;
}

message ResolveRequest {
  // URL or connector-native reference as the user typed it.
  string ref = 1;
}

message ResolveResponse {
  RemoteItem item = 1;
}

message HandleIntentRequest {
  string external_id = 1;
  Intent intent = 2;
  // Intent-specific parameters (e.g. {"title": ...} for RENAME,
  // {"due": RFC3339} for SET_DUE). Kept loose here; the core validates
  // against the standard vocabulary before dispatch.
  google.protobuf.Struct params = 3;
  // Idempotency key: retries after a crash reuse it, connectors that can
  // dedupe should.
  string idempotency_key = 4;
}

message HandleIntentResponse {
  // Remote-confirmed state after the intent. The core applies it to the
  // mirror immediately — never optimistically before this arrives.
  RemoteItem item = 1;
}

message WatchRemoteRequest {
  // Opaque connector-defined resume cursor; empty starts from now.
  string cursor = 1;
}

message WatchRemoteResponse {
  oneof msg {
    RemoteItem upsert = 1;
    string delete_external_id = 2;
    // Resume position; the core persists it.
    string cursor = 3;
  }
}
