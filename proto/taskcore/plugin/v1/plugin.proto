syntax = "proto3";

package taskcore.plugin.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "taskcore/v1/rule.proto";
import "taskcore/v1/schema_service.proto";
import "taskcore/view/v1/contribution.proto";

option go_package = "todoapp/gen/taskcore/plugin/v1;pluginv1";

// Plugin is implemented by every plugin executable. Process model: the host
// spawns one process per connector instance, hands it a unix socket path via
// TASKPLUGIN_SOCKET (the plugin serves this service there) and
// TASKPLUGIN_COREHOST_SOCKET (core services for the plugin, see
// corehost.proto), then calls GetManifest and Configure exactly once each.
// Supervision is the host's job: a crashed plugin is restarted with backoff.
service PluginService {
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  // Configure binds this process to one named instance with its config.
  // Returned capabilities may depend on the config.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message GetManifestRequest {}

message GetManifestResponse {
  Manifest manifest = 1;
}

// Manifest is a plugin's static self-description. The core persists it: kinds
// stay renderable, filterable, and exportable after the plugin is gone, and a
// new version whose types would make stored data unreadable is refused at
// load (additive-only evolution).
message Manifest {
  string name = 1;    // e.g. "ics"
  string version = 2; // plugin version, not proto version
  repeated KindRegistration kinds = 3;
  // Which plugin services this executable implements: "connector" now;
  // "hook", "view_contributor" in later phases.
  repeated string services = 4;
  // Starter rules for this plugin's kinds: proposals the user copies into
  // their config (via RuleService.ListRuleTemplates) and edits freely.
  // Plugins propose; user config disposes — templates are never enforced.
  repeated taskcore.v1.Rule rule_templates = 5;
  // Display contributions for this plugin's kinds, validated at
  // registration exactly like rule templates.
  repeated taskcore.view.v1.Presentation presentations = 6;
}

message KindRegistration {
  string kind = 1; // e.g. "calendar.event"
  // Facet declarations with virtual-field bindings (CEL over `item`), the
  // same schema SchemaService serves to frontends.
  repeated taskcore.v1.FacetBinding facets = 2;
  // Descriptors for every message type this kind stores in mirror.data.
  // Registered into the core's schema registry and the CEL environment so
  // bindings and filters can reach into typed extension data.
  google.protobuf.FileDescriptorSet types = 3;
}

message ConfigureRequest {
  // Instance name, e.g. "cal@personal". Also the link namespace.
  string instance_name = 1;
  // Instance config as parsed from the user's config file. The plugin
  // validates and rejects with InvalidArgument on bad config.
  google.protobuf.Struct config = 2;
}

message ConfigureResponse {
  Capabilities capabilities = 1;
}

message Capabilities {
  Enumeration enumeration = 1;
  // Poll hint for SNAPSHOT sources; the core owns scheduling and may clamp.
  google.protobuf.Duration poll_interval = 2;
  // Which standard intents this instance handles, per kind. Empty = read-only.
  repeated KindIntents intents = 3;
}

enum Enumeration {
  ENUMERATION_UNSPECIFIED = 0;
  // The connector can only enumerate the full in-scope set; the core diffs
  // consecutive snapshots into events.
  ENUMERATION_SNAPSHOT = 1;
  // The connector can stream changes (webhooks, cursors) via WatchRemote.
  ENUMERATION_INCREMENTAL = 2;
}

message KindIntents {
  string kind = 1;
  repeated Intent intents = 2;
}

// The standard intent vocabulary, anchored to facets (DESIGN.md §7 of the
// write path): any mirror → RENAME/ADD_COMMENT/DELETE; schedulable →
// SET_DUE/SET_START; assignable → ASSIGN; prioritized → SET_PRIORITY;
// completable → SET_COMPLETED.
enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_RENAME = 1;
  INTENT_ADD_COMMENT = 2;
  INTENT_DELETE = 3;
  INTENT_SET_DUE = 4;
  INTENT_SET_START = 5;
  INTENT_ASSIGN = 6;
  INTENT_SET_PRIORITY = 7;
  INTENT_SET_COMPLETED = 8;
}
