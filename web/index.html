<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taskd</title>

    <!-- Installable app: manifest + icons. localhost is a secure context, so a
         manifest + icon is enough for Chrome to offer "Install". -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Toolbar/splash color follows the paper (light) / dusk (dark) palette. -->
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141519" media="(prefers-color-scheme: dark)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="taskd" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
